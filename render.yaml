services:
  - type: web
    name: pizza-negocio-api
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pizza-negocio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: pizza-negocio-web
    runtime: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: ./docs
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: pizza-negocio-db
    plan: free
    databaseName: inventario
    user: inventario_user
